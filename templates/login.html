<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Login</title>
</head>
<body>
    {# 
      O Jinja2 aplica autoescape automatico para todas as variaveis renderizadas via {{ ... }}.
      Isso impede vulnerabilidades de XSS Refletido e Injecao de HTML na exibicao do erro.
    #}
    <h2>TaskFlow - Autenticação</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
        <div>
            <label for="username">Usuário:</label>
            <input type="text" id="username" name="username" required autocomplete="off">
        </div>
        <br>
        <div>
            <label for="password">Senha:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <br>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>

<!--
=============================================================================
RESUMO DAS CORREÇÕES E PRÁTICAS DE HARDENING NO TEMPLATES/LOGIN.HTML
=============================================================================

Sintaxe Correta de Comentários no Jinja2 ({# ... #})
- O que mudou: Substituição de comentários HTML contendo lógica
  do Jinja por blocos de comentário nativos do Jinja2 ({# ... #}).
- Por quê: O analisador do Jinja2 tentava interpretar a pontuação e os
  símbolos '{{ ... }}' contidos dentro de comentários HTML normais como se
  fossem comandos executáveis, gerando 'jinja2.exceptions.TemplateSyntaxError'
  e disparando o erro HTTP 500 no smoke test do container.

Saneamento e Mitigação de XSS Refletido (Autoescape)
- O que mudou: Exibição da mensagem de erro utilizando a interpolação padrão
  {{ error }} sem uso da flag |safe.
- Por quê: Assegura que entradas potencialmente maliciosas enviadas na rota
  de login sejam sanitizadas antes da renderização no navegador, neutralizando
  ataques do tipo Cross-Site Scripting (XSS) Refletido.

Controles de Segurança de Formulário (Método POST e Autocomplete)
- O que mudou: Uso obrigatório de método POST para submissão e adição de
  'autocomplete="off"' no campo de nome de usuário.
- Por quê: Impede que credenciais sensíveis vazem nos cabeçalhos HTTP (Referer)
  ou em históricos de navegação/proxy e dificulta a extração inadvertida de
  dados de login em dispositivos compartilhados.
-->
