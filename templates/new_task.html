<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>TaskFlow - Nova Tarefa</title>
</head>
<body>
  <h1>Nova tarefa</h1>

  <!-- Restricoes do lado do cliente (required, maxlength) auxiliam na defesa    -->
  <!-- em profundidade contra envios de payloads excessivamente grandes.        -->
  <form method="post">
    <label>Titulo: <input type="text" name="title" required maxlength="100"></label><br>
    <label>Descricao: <textarea name="description" maxlength="500"></textarea></label><br>
    <input type="submit" value="Salvar">
  </form>

  <!-- Uso do url_for() para roteamento dinamico seguro mantido pelo Flask.      -->
  <a href="{{ url_for('tasks') }}">Voltar</a>
</body>
</html>
