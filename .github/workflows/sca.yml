# =============================================================================
# SCA - Auditoria de Dependencias - TaskFlow
# pip-audit compara cada pacote do requirements.txt com a base de CVEs da PyPA.
# Qualquer CVE conhecida -> job falha -> merge bloqueado (required check).
# Complementa o Dependabot: o Dependabot abre PRs, o pip-audit barra o que entra.
# =============================================================================

name: SCA - Auditoria de Dependencias

# ANTES: push/PR em qualquer branch ("**"), sem disparo manual nem agendamento.
# AGORA: mesmo padrao dos outros workflows + schedule semanal, porque CVEs
#        novas surgem mesmo quando o codigo nao muda.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # toda segunda as 09:00 UTC

# ANTES: sem permissions. AGORA: minimo privilegio, so leitura do codigo.
permissions:
  contents: read

# ANTES: Python "3.11" fixo no step e pip-audit sem versao.
# AGORA: versoes centralizadas e iguais as dos outros workflows.
env:
  PYTHON_VERSION: "3.12"
  PIP_AUDIT_VERSION: "2.7.3"
  REQUIREMENTS_FILE: requirements.txt

jobs:
  pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      # ANTES: tags mutaveis (@v4 / @v5). AGORA: pin por SHA.
      - name: Checkout do codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar pip-audit
        run: pip install "pip-audit==${{ env.PIP_AUDIT_VERSION }}"

      # Sem --ignore-vuln e sem continue-on-error: e um gate de verdade.
      # --strict -> falha tambem se algum pacote nao puder ser auditado.
      # --desc   -> mostra a descricao de cada CVE no log (ajuda na triagem).
      # Se um dia uma CVE precisar ser aceita (sem correcao disponivel), usar
      # --ignore-vuln <ID> com justificativa escrita aqui e no docs/.
      - name: Auditar ${{ env.REQUIREMENTS_FILE }}
        run: pip-audit -r ${{ env.REQUIREMENTS_FILE }} --strict --desc
