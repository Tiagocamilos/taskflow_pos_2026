name: Container - Build e Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e-trivy:
    name: Build da imagem e scan com Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@ # v4.4.0

      - name: Build da imagem Docker
        run: docker build -t taskflow:${{ github.sha }} .

      - name: Trivy image (gate HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ # v0.36.0
        with:
          image-ref: taskflow:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
