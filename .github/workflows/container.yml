name: Container - Build e Trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e-trivy:
    name: Build da imagem e scan com Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
      # Muda pin por SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build da imagem Docker
       # Muda pin por SHA
        run: docker build -t taskflow:${{ github.sha }} .

      - name: Trivy image (gate HIGH,CRITICAL)
       # Muda pin por SHA
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: taskflow:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
