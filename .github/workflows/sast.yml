# =============================================================================
# SAST e Secret Scanning - TaskFlow
# - Semgrep: analisa o codigo Python em busca de vulnerabilidades (SQLi, XSS, debug...).
# - Gitleaks: varre TODO o historico do Git em busca de segredos commitados.
# Os dois jobs sao required checks: qualquer achado bloqueia o merge do PR.
# =============================================================================

name: SAST e Secret Scanning

# ANTES: push/pull_request em qualquer branch ("**") e sem disparo manual.
# AGORA: mesmo padrao do ci.yml -> PR para a main (o portao), push na main
#        e workflow_dispatch para rodar manualmente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimo privilegio: ler o codigo; pull-requests: read e usado pelo Gitleaks
# para listar os commits do PR.
permissions:
  contents: read
  pull-requests: read

# AGORA: versoes centralizadas (antes: "pip install semgrep" sem versao -> build
#        nao reprodutivel, cada execucao podia usar um Semgrep diferente).
# Ao atualizar, conferir a versao mais recente em https://pypi.org/project/semgrep/
env:
  PYTHON_VERSION: "3.12"
  SEMGREP_VERSION: "1.90.0"

jobs:
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # AGORA: Python fixado e com o mesmo pin por SHA do ci.yml.
      # Utiliza cache de pip para acelerar futuras execuções das dependências.
      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # setuptools<81: versoes novas removeram o pkg_resources, que ainda e
      # importado por uma dependencia do Semgrep (opentelemetry). Sem essa
      # restricao o Semgrep quebra antes de escanear (ModuleNotFoundError).
      - name: Instalar Semgrep
        run: pip install "semgrep==${{ env.SEMGREP_VERSION }}" "setuptools<81"

      # Rulesets exigidos pela atividade: python, flask e security-audit.
      # --error  -> exit code != 0 se houver achado (e isso que torna o job um GATE).
      # --exclude=codigo -> ignora o material de referencia do professor
      #                     (exemplos vulneraveis de proposito, nao fazem parte da app).
      - name: Rodar Semgrep (python + flask + security-audit)
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/flask \
            --config=p/security-audit \
            --exclude=codigo \
            --error \
            .

  gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -> traz TODO o historico. Segredo apagado do arquivo
      # continua vivo nos commits antigos, entao precisa ser varrido tambem.
      - name: Checkout do codigo (historico completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # O Gitleaks le automaticamente o .gitleaks.toml da raiz, se existir
      # (allowlist justificada para segredos didaticos ou de demonstracao).
      - name: Rodar Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


# =============================================================================
# RESUMO DAS MUDANÇAS E BOAS PRÁTICAS APLICADAS NO SAST.YML
# =============================================================================

# Permissões do GITHUB_TOKEN (permissions: contents: read, pull-requests: read)
# - O que mudou: Definição restrita de permissões globais do token.
# - Por quê: Limita as ações da pipeline para apenas o estritamente necessário (ler código e dados de PR), prevenindo ações não autorizadas em caso de comprometimento da Action.

# Padronização de Gatilhos (on: push, pull_request, workflow_dispatch)
# - O que mudou: Restrição dos disparos de branch genérico ("**") para focar na branch principal `main` e permitir execução manual.
# - Por quê: Uniformiza a política de execução da esteira (Quality Gate nos PRs para a main e validação na integração).

# Fixação por SHA dos commits nas Actions (actions/checkout, setup-python e gitleaks-action)
# - O que mudou: Troca de tags de versão dinâmicas (@v4, @v2.3.9) por hashes imutáveis SHA-1.
# - Por quê: Bloqueia ataques na cadeia de suprimentos (Supply Chain Attacks), assegurando a integridade do código das dependências de terceiros executadas no runner.

# Centralização e Fixação de Versão (SEMGREP_VERSION: "1.90.0")
# - O que mudou: Definição da versão exata do Semgrep no bloco env e compatibilidade via setuptools<81.
# - Por quê: Elimina inconsistências e builds não reprodutíveis decorrentes do uso do `pip install semgrep` sem versão, além de evitar travamentos causados por quebras de compatibilidade em libs Python internas.

# Análise Estática de Código (Semgrep SAST Gate)
# - O que mudou: Execução das regras p/python, p/flask e p/security-audit com a flag --error.
# - Por quê: Detecta falhas de segurança no código-fonte (SQL Injection, XSS, etc.) e bloqueia o pipeline caso vulnerabilidades sejam encontradas, funcionando como Quality Gate real.

# Varredura de Histórico Completo de Segredos (Gitleaks + fetch-depth: 0)
# - O que mudou: Inclusão do checkout completo (fetch-depth: 0) para a execução do Gitleaks.
# - Por quê: Impede que segredos, credenciais ou tokens expostos em commits anteriores passem desapercebidos mesmo que já tenham sido removidos no commit mais recente.
