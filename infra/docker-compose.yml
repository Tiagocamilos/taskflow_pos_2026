# TaskFlow (web) + Postgres (db).
# O "db" e o banco SIMULADO da Aula 6: a TaskFlow continua usando SQLite.
# Subir a partir da raiz: docker compose -f infra/docker-compose.yml --env-file .env up -d --build

name: taskflow

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: taskflow-web
    ports:
      - "5000:5000"                      # unica porta exposta ao host
    environment:                          # segredos vem do .env (":?" falha se faltar)
      TASKFLOW_SECRET_KEY: ${TASKFLOW_SECRET_KEY:?defina no .env}
      TASKFLOW_ADMIN_PASSWORD: ${TASKFLOW_ADMIN_PASSWORD:?defina no .env}
    networks: [frontend, backend]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - taskflow_app_data:/app/data       # SQLite
      - ../logs:/app/logs                 # logs para o Promtail
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    # SEM "ports:" -> banco nao exposto ao host; so o web alcanca pela rede backend
    networks: [backend]
    volumes:
      - taskflow_db_data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend: {}
  backend:
    internal: true                        # db sem acesso a internet

volumes:
  taskflow_app_data: {}
  taskflow_db_data: {}
